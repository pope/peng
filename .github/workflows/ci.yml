name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            artifact_name: peng-x86_64-linux
          - os: macos-latest
            target: aarch64-darwin
            artifact_name: peng-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Check formatting and lints
        if: matrix.target == 'x86_64-linux'
        run: nix build --no-link -L .#checks.x86_64-linux.treefmt

      - name: Build and test static binaries
        run: nix build .#peng-static -L

      - name: Verify hot-reload build
        run: nix build --no-link -L .#checks.${{ matrix.target }}.hot-reload

      - name: Package archive
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          cp result/bin/peng result/bin/peng-msg LICENSE README.md \
            "dist/${{ matrix.artifact_name }}/"
          chmod 0755 \
            "dist/${{ matrix.artifact_name }}/peng" \
            "dist/${{ matrix.artifact_name }}/peng-msg"
          chmod 0644 \
            "dist/${{ matrix.artifact_name }}/LICENSE" \
            "dist/${{ matrix.artifact_name }}/README.md"
          COPYFILE_DISABLE=1 tar -C dist -czf "${{ matrix.artifact_name }}.tar.gz" \
            "${{ matrix.artifact_name }}"

      - name: Upload artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build (x86_64-windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install shader compilers
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-cross

      - name: Expose shader compilers on PATH
        run: |
          $ucrtBin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $ucrtBin

      - name: Build and test binaries
        env:
          SDL_VIDEO_DRIVER: dummy
          TERM: dumb
        run: |
          zig build --release=safe -Dcpu=x86_64_v3
          zig build test-unit --release=safe -Dcpu=x86_64_v3

      - name: Package archive
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        run: |
          $pkgDir = "dist/peng-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item `
            zig-out/bin/peng.exe, `
            zig-out/bin/peng-msg.exe, `
            zig-out/bin/*.dll, `
            LICENSE, `
            README.md `
            -Destination $pkgDir
          Compress-Archive `
            -Path $pkgDir `
            -DestinationPath "peng-x86_64-windows.zip" `
            -Force

      - name: Upload artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: peng-x86_64-windows
          path: peng-x86_64-windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
