name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-15
            target: aarch64-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check formatting and lints
        if: matrix.target == 'x86_64-linux'
        run: nix build --no-link -L .#checks.x86_64-linux.treefmt

      - name: Run unit tests
        run: nix build --no-link -L .#checks.${{ matrix.target }}.unit-tests

      - name: Verify hot-reload build
        run: nix build --no-link -L .#checks.${{ matrix.target }}.hot-reload

  build-static:
    name: Build static (${{ matrix.artifact_name }})
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: peng-x86_64-linux
          - os: macos-15
            artifact_name: peng-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build static binaries
        run: nix build .#peng-static -L

      - name: Package archive
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          cp result/bin/peng result/bin/peng-msg LICENSE README.md \
            "dist/${{ matrix.artifact_name }}/"
          chmod 0755 \
            "dist/${{ matrix.artifact_name }}/peng" \
            "dist/${{ matrix.artifact_name }}/peng-msg"
          chmod 0644 \
            "dist/${{ matrix.artifact_name }}/LICENSE" \
            "dist/${{ matrix.artifact_name }}/README.md"
          tar -C dist -czf "${{ matrix.artifact_name }}.tar.gz" \
            "${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-static
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz artifacts/SHA256SUMS.txt \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
